<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <!-- Links -->
    <line x1="50" y1="20" x2="25" y2="50" stroke="#333" stroke-width="6"/>
    <line x1="50" y1="20" x2="75" y2="50" stroke="#333" stroke-width="6"/>
    <line x1="25" y1="50" x2="10" y2="80" stroke="#333" stroke-width="6"/>
    <line x1="25" y1="50" x2="40" y2="80" stroke="#333" stroke-width="6"/>
    <line x1="75" y1="50" x2="60" y2="80" stroke="#333" stroke-width="6"/>
    <line x1="75" y1="50" x2="90" y2="80" stroke="#333" stroke-width="6"/>

    <!-- Nodes -->
    <circle cx="50" cy="20" r="12" fill="#cc0000"/>
    <circle cx="25" cy="50" r="10" fill="#cc0000"/>
    <circle cx="75" cy="50" r="10" fill="#cc0000"/>
    <circle cx="10" cy="80" r="8" fill="#cc0000"/>
    <circle cx="40" cy="80" r="8" fill="#cc0000"/>
    <circle cx="60" cy="80" r="8" fill="#cc0000"/>
    <circle cx="90" cy="80" r="8" fill="#cc0000"/>
