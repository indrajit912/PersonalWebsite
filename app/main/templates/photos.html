{% extends 'base.html' %}

{% block title %}Photos | Indrajit Ghosh{% endblock %}

{% block styles %}
    {{ super() }}
    <link rel="stylesheet" href="{{ url_for('main.static', filename='css/photo_style.css') }}">
{% endblock %}

{% block content %}

<section>
    <div class="gallery-container">
        <div class="page-heading">
            <div style="display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 1.5rem; flex-wrap: wrap;">
    <canvas id="photoIconCanvas" width="90" height="90" style="border-radius: 50%; background: #ffffff; box-shadow: 0 4px 10px rgba(0,0,0,0.08); border: 1px solid #eaeaea; cursor: crosshair;"></canvas>
    <h1 style="margin: 0; font-size: 3.5rem; font-weight: 800; color: #2c3e50; letter-spacing: -1px;">Photography</h1>
</div>
<script>
    const phCanvas = document.getElementById('photoIconCanvas');
    const phCtx = phCanvas.getContext('2d');
    let phMouseDist = 0;
    
    phCanvas.addEventListener('mousemove', (e) => {
        const rect = phCanvas.getBoundingClientRect();
        let dx = (e.clientX - rect.left) - 45;
        let dy = (e.clientY - rect.top) - 45;
        phMouseDist = Math.sqrt(dx*dx + dy*dy);
    });
    phCanvas.addEventListener('mouseleave', () => {
        phMouseDist = 0;
    });

    function animateAperture() {
        phCtx.clearRect(0, 0, phCanvas.width, phCanvas.height);
        
        let targetRadius = 5 + (phMouseDist / 60) * 20; 
        if (targetRadius > 25) targetRadius = 25;
        
        phCtx.beginPath();
        phCtx.arc(45, 45, 38, 0, Math.PI*2);
        phCtx.strokeStyle = '#333';
        phCtx.lineWidth = 3;
        phCtx.stroke();

        phCtx.strokeStyle = '#555';
        phCtx.lineWidth = 1.5;
        for(let i=0; i<6; i++) {
            let angle = (i / 6) * Math.PI * 2;
            let nextAngle = ((i+1) / 6) * Math.PI * 2;
            
            let innerX = 45 + Math.cos(angle) * targetRadius;
            let innerY = 45 + Math.sin(angle) * targetRadius;
            
            let outerX = 45 + Math.cos(nextAngle + 0.5) * 38;
            let outerY = 45 + Math.sin(nextAngle + 0.5) * 38;
            
            phCtx.beginPath();
            phCtx.moveTo(innerX, innerY);
            phCtx.lineTo(outerX, outerY);
            phCtx.stroke();
        }
        
        phCtx.beginPath();
        phCtx.arc(45, 45, targetRadius, 0, Math.PI*2);
        phCtx.strokeStyle = '#333';
        phCtx.lineWidth = 2;
        phCtx.stroke();
        
        requestAnimationFrame(animateAperture);
    }
    animateAperture();
</script>
            <div class="page-quote-wrapper">
                <blockquote class="page-quote">
                    To photograph is to hold one's breath, when all faculties converge to capture fleeting reality.
                    <footer>Henri Cartier-Bresson</footer>
                </blockquote>
            </div>
        </div>

        <div class="masonry-gallery">
            <div class="gallery-item">
                <div class="img-wrapper">
                    <img src="{{ url_for('main.static', filename='images/indrajit/IMG_8494.jpg') }}" alt="Recent photograph of Indrajit">
                </div>
            </div>

            <div class="gallery-item">
                <div class="img-wrapper">
                    <img src="{{ url_for('main.static', filename='images/indrajit/herley.jpg') }}" alt="Indrajit writing on whiteboard">
                </div>
            </div>

            <div class="gallery-item">
                <div class="img-wrapper">
                    <img src="{{ url_for('main.static', filename='images/indrajit/airplane.jpg') }}" alt="Indrajit in ISI Campus">
                </div>
            </div>

            <div class="gallery-item">
                <div class="img-wrapper">
                    <img src="{{ url_for('main.static', filename='images/indrajit/photo2.jpg') }}" alt="Indrajit in front of ISI Academic building" loading="lazy">
                </div>
            </div>

            <div class="gallery-item">
                <div class="img-wrapper">
                    <img src="{{ url_for('main.static', filename='images/indrajit/kapoor_cafe.jpg') }}" alt="Indrajit at a cafe" loading="lazy">
                </div>
            </div>

            <div class="gallery-item">
                <div class="img-wrapper">
                    <img src="{{ url_for('main.static', filename='images/indrajit/blue_tokai.jpg') }}" alt="Indrajit in a restaurant" loading="lazy">
                </div>
            </div>

            <div class="gallery-item">
                <div class="img-wrapper">
                    <img src="{{ url_for('main.static', filename='images/indra_library/books.jpg') }}" alt="Indrajit's ISI Bookshelf" loading="lazy">
                </div>
            </div>
        </div>
    </div>
</section>

{% endblock %}
